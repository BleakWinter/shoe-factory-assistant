global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    host: homeserver

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          instance: homeserver
  - job_name: containers
    scrape_interval: 30s
    static_configs:
      - targets: ['127.0.0.1:8085']
        labels:
          instance: homeserver
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_tasks_state|container_blkio_device_usage_total|container_memory_failures_total'
        action: drop
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
        labels:
          instance: homeserver
  - job_name: alertmanager
    static_configs:
      - targets: ['127.0.0.1:9093']
        labels:
          instance: homeserver

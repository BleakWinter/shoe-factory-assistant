# Add these locations inside the existing server block. Grafana listens only on
# Docker's host bridge, and the existing Nginx publishes only the Tailscale IP.
location = /grafana {
    return 301 /grafana/;
}

location = /grafana/metrics {
    return 404;
}

location ^~ /grafana/ {
    proxy_pass http://172.17.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $jenkins_connection_upgrade;
    proxy_read_timeout 90s;
}

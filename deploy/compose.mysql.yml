name: shoe-factory-mysql

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4.13}
    container_name: shoe-factory-mysql
    restart: unless-stopped
    mem_limit: 768m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
      - --mysqlx=OFF
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shoe_factory_test}
      MYSQL_USER: ${MYSQL_APP_USER:-shoe_factory_app}
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root-password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql-app-password
    secrets:
      - mysql-root-password
      - mysql-app-password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

secrets:
  mysql-root-password:
    file: ${MYSQL_ROOT_PASSWORD_PATH:?Set the path to the MySQL root password file}
  mysql-app-password:
    file: ${MYSQL_APP_PASSWORD_PATH:?Set the path to the MySQL application password file}

volumes:
  mysql-data:

networks:
  data:
    external: true
    name: shoe-factory-data
